<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>航線地球儀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap">
<style>
/*
VOICE: quiet luxury, like a first-class cabin at night: black, hairlines, white light.
IDEA: the moving-map in a private jet: a dotted earth floating in black, the route a thin line of light.
PICTURE: a dot-matrix globe with an atmospheric halo, a glowing white great-circle, a white plane and a live clock.
COLOUR and TYPE: pure black, graphite hairlines, white ink in three weights; ice blue = left window, rose = right window. Inter Tight light for figures and codes, Noto Sans TC for Chinese.
LAYOUT: header with language switch, itinerary card, globe left + guide right; stacks on phones.
*/
:root{color-scheme:dark;--bg:#000;--card:#0a0a0a;--card2:#111;--ink:#f5f5f4;--mute:#8a8a8a;--dim:#5a5a5a;--line:#1d1d1d;--line2:#2a2a2a;
--left:#7fb2ff;--right:#ff7d98;--warn:#ff6b6b;--on:#000;--pop:#0d0d0d;--hover:#1a1a1a;--glass:rgba(0,0,0,.6);--shadow:rgba(0,0,0,.8);--thumb:rgba(255,255,255,.12)}
:root[data-look=light]{color-scheme:light;--bg:#fafaf9;--card:#fff;--card2:#f5f5f4;--ink:#0a0a0a;--mute:#6b6b6b;--dim:#a3a3a3;--line:#ececea;--line2:#dcdcda;
--left:#2f6bff;--right:#e0436b;--warn:#d93636;--on:#fff;--pop:#fff;--hover:#f2f2f1;--glass:rgba(255,255,255,.78);--shadow:rgba(0,0,0,.12);--thumb:rgba(0,0,0,.08)}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.6 "Inter Tight","Noto Sans TC",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:0 max(4vw,16px)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:28px;padding-bottom:4px}
h1{font-weight:200;font-size:clamp(30px,4vw,48px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--mute);margin:8px 0 0;font-size:15px}
.lang{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;flex:none}
.lang button{min-height:36px;border:0;background:transparent;color:var(--mute);border-radius:999px;padding:0 14px;font-size:14px;font-weight:400}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--on);font-weight:500}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;flex:none}
.pdf{min-height:44px;font-size:14px;gap:6px;display:inline-flex;align-items:center}.pdf[hidden]{display:none}
button{font:inherit;cursor:pointer;color:var(--ink);background:transparent;border:1px solid var(--line2);border-radius:999px;min-height:44px;padding:0 16px;transition:border-color .2s,background .2s,color .2s}
button:hover{border-color:#555}
button:focus-visible,input:focus{outline:1px solid var(--ink);outline-offset:2px}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.itin{margin-top:22px;padding:18px 20px}
.lbl{font-size:13px;color:var(--mute);margin:0}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.preset{min-height:34px;font-size:13px;padding:0 14px;color:var(--mute)}
.preset:hover{color:var(--ink)}

.legs{display:flex;flex-direction:column;margin-top:8px}
.leg{display:grid;grid-template-columns:28px minmax(0,1fr) 28px minmax(0,1fr) 44px;gap:10px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.num{font-size:13px;color:var(--dim);padding-top:14px;text-align:center;font-variant-numeric:tabular-nums}
.leg .arrow{padding-top:12px;text-align:center;color:var(--dim)}
.fld{position:relative}
.fld>input{font-weight:400;font-size:22px;letter-spacing:.14em;text-transform:uppercase;height:50px}
.fld>input::placeholder{font-size:15px;letter-spacing:0;color:var(--dim);text-transform:none}
.cap{display:block;font-size:12px;color:var(--mute);margin:4px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.cap.bad,.tcap.bad{color:var(--warn)}
.tm{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:6px;margin-top:8px}.tl,.tcap{grid-column:1/-1}
.tl{font-size:12px;color:var(--dim)}
.tm input{height:42px;min-height:42px;padding:6px 10px;-webkit-appearance:none;appearance:none;text-align:left;font-variant-numeric:tabular-nums}
.tm input::-webkit-date-and-time-value{text-align:left}
:root:not([data-look=light]) .tm input::-webkit-calendar-picker-indicator{filter:invert(.7)}
.tcap{display:block;font-size:12px;color:var(--mute);min-height:16px}
.del{width:44px;padding:0;border-color:transparent;color:var(--dim);font-size:18px;margin-top:3px}
.del:hover{color:var(--ink);border-color:var(--line2)}
.addleg{margin-top:14px;width:100%;border-style:dashed;color:var(--mute);font-weight:400}
.addleg:hover{color:var(--ink)}
.sug{position:absolute;z-index:5;top:54px;left:0;width:max(100%,320px);background:var(--pop);border:1px solid var(--line2);border-radius:14px;box-shadow:0 20px 50px var(--shadow);display:none;max-height:280px;overflow:auto;padding:4px}
.sug button{display:block;width:100%;text-align:left;border:0;border-radius:10px;min-height:42px;font-size:14px;color:var(--mute)}
.sug button b{color:var(--ink);font-weight:500;letter-spacing:.08em;margin-right:8px}
.sug button:hover,.sug button.on{background:var(--hover);color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin-top:16px;margin-bottom:40px}
.globe{overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.fig{position:relative;flex:1;min-height:360px;height:min(72vh,680px);touch-action:none;cursor:grab}
.fig:active{cursor:grabbing}
.fig>canvas{position:absolute;inset:0;width:100%;height:100%}
.legend{position:absolute;left:16px;top:14px;font-size:12px;color:var(--mute);display:flex;gap:14px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.mapstyle{position:absolute;left:14px;top:40px;display:flex;gap:2px;padding:3px;border:1px solid var(--line2);border-radius:999px;background:var(--glass);backdrop-filter:blur(6px);z-index:2}
.mapstyle button{min-height:30px;border:0;padding:0 12px;font-size:12px;color:var(--mute)}
.mapstyle button[aria-pressed=true]{background:var(--ink);color:var(--on);font-weight:500}
@media(max-width:600px){.mapstyle{right:64px;left:12px;overflow-x:auto;width:max-content;max-width:calc(100% - 76px)}.mapstyle button{padding:0 10px;flex:none}}
.zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:40px;min-height:40px;padding:0;font-size:18px;color:var(--mute);background:var(--glass);backdrop-filter:blur(6px)}
.zoom button:hover{color:var(--ink)}
.clock{position:absolute;left:16px;bottom:16px;right:16px;display:flex;flex-wrap:wrap;gap:22px;pointer-events:none;align-items:flex-end}
.clock:empty{display:none}
.clock span{display:block;font-size:11px;color:var(--mute);letter-spacing:.02em}
.clock b{font-weight:200;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.clock em{font-style:normal;font-size:13px;color:var(--mute);margin-left:6px}
.clock .sep{width:1px;align-self:stretch;background:var(--line2)}
.clock .hint{font-size:12px;color:var(--dim)}
.player{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:14px 18px 10px;border-top:1px solid var(--line)}
.play{width:46px;height:46px;padding:0;background:var(--ink);color:var(--on);border-color:var(--ink);font-size:14px}
.play:hover{opacity:.85}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;height:44px}
input[type=range]:focus{outline:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--ink) var(--p,0%),var(--line2) var(--p,0%))}
input[type=range]::-moz-range-track{height:2px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:-6px;box-shadow:0 0 0 5px var(--thumb)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--ink)}
.now{grid-column:1/-1;font-size:13px;color:var(--mute);padding-bottom:4px}
.now b{color:var(--ink);font-weight:500;letter-spacing:.06em}
aside{display:flex;flex-direction:column;gap:16px}
.panel{padding:20px 22px}
h2{font-size:13px;font-weight:400;color:var(--mute);margin:0 0 14px;letter-spacing:.02em}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:6px}
.tot div{background:var(--card);padding:12px 14px}
.tot span{display:block;font-size:11px;color:var(--mute)}
.tot b{font-weight:200;font-size:26px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.seg:last-child{border-bottom:0}
.seg .code{font-size:20px;font-weight:300;letter-spacing:.14em}
.seg .r{text-align:right;white-space:nowrap;font-size:14px;font-variant-numeric:tabular-nums}
.seg .m{color:var(--mute);font-size:12px;grid-column:1/-1}
.xfer{font-size:12px;color:var(--mute);padding:10px 0 0;display:flex;align-items:center;gap:8px}
.xfer::before{content:"";width:16px;height:1px;background:var(--line2)}
.xfer.bad{color:var(--warn)}
.sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.sides h3{font-size:13px;font-weight:500;margin:0 0 4px;display:flex;align-items:center}
.lm{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;min-height:44px}
.lm b{display:block;font-weight:400;font-size:15px}
.lm span{font-size:12px;color:var(--mute)}
.lm:hover b{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--dim)}
.empty{color:var(--dim);font-size:13px}
.note{font-size:12px;color:var(--dim);margin:14px 0 0;line-height:1.6}
.msg{color:var(--warn);font-size:13px;min-height:1em;margin-top:6px}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}.fig{height:min(64vh,540px)}}
@media(max-width:600px){header{flex-direction:column;align-items:stretch}.ctrls{justify-content:flex-start}.itin{padding:16px}
  .leg{grid-template-columns:22px minmax(0,1fr) 36px;gap:8px}.leg .fld{grid-column:2}.leg .arrow{display:none}.leg .num{grid-row:1}
  .del{width:36px;min-height:36px;grid-column:3;grid-row:1}.leg .fld+.arrow+.fld{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
  .sug{width:100%}.tm{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tl,.tcap{grid-column:1/-1}.tm input{padding:6px 8px}
  .sides{grid-template-columns:minmax(0,1fr)}.tot b{font-size:21px}.fig{height:480px;flex:none}.clock{gap:12px;flex-wrap:nowrap;left:14px;right:14px;bottom:14px}.clock>div{flex:1 1 0}.clock b{font-size:24px}.clock em{display:block;margin:2px 0 0}.clock .hint{display:none}.tm{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1 data-t="title"></h1><p class="sub" data-t="sub"></p></div>
  <div class="ctrls"><div class="lang" role="group" aria-label="Language"><button data-lang="zh">中文</button><button data-lang="en">EN</button></div><div class="lang" id="look" role="group"><button data-look="dark" data-t="dark"></button><button data-look="light" data-t="light"></button></div><button class="pdf" id="pdf" hidden><span aria-hidden="true">↓</span><span data-t="pdf"></span></button></div>
</header>

<section class="card itin">
  <p class="lbl" data-t="legsLabel"></p>
  <div class="presets" id="presets"></div>
  <div class="legs" id="legs"></div>
  <button class="addleg" id="addLeg" data-t="addLeg"></button>
  <div class="msg" id="msg" role="status"></div>
</section>
<div class="msg" id="pmsg" role="status" style="text-align:right"></div>

<main>
  <section class="card globe">
    <div class="fig" id="fig">
      <canvas id="cv"></canvas>
      <div class="legend"><span><i class="dot" style="background:var(--left)"></i><span data-t="leftWin"></span></span><span><i class="dot" style="background:var(--right)"></i><span data-t="rightWin"></span></span></div>
      <div class="mapstyle" id="mapstyle" role="group"></div>
      <div class="clock" id="clock"></div>
      <div class="zoom"><button id="zin" data-ta="zin">＋</button><button id="zout" data-ta="zout">－</button><button id="fit" data-ta="fit" style="font-size:15px">◎</button></div>
    </div>
    <div class="player">
      <button class="play" id="play" data-ta="play">▶</button>
      <input type="range" id="prog" min="0" max="1000" value="0" data-ta="progress">
      <div class="now" id="now"></div>
    </div>
  </section>
  <aside>
    <div class="card panel"><h2 data-t="itinerary"></h2><div id="summary"></div></div>
    <div class="card panel"><h2 data-t="windows"></h2><div class="sides">
      <div><h3><i class="dot" style="background:var(--left)"></i><span data-t="leftSeat"></span></h3><div id="L"></div></div>
      <div><h3><i class="dot" style="background:var(--right)"></i><span data-t="rightSeat"></span></h3><div id="R"></div></div>
    </div><p class="note" data-t="note"></p></div>
  </aside>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=6371,SPEED=830;

const TZF={};
function tzOff(ms,tz){const f=TZF[tz]||(TZF[tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}));
  const p=Object.fromEntries(f.formatToParts(new Date(ms)).map(x=>[x.type,x.value]));return Date.UTC(+p.year,p.month-1,+p.day,+p.hour%24,+p.minute)-Math.floor(ms/6e4)*6e4}
function toUTC(d,t,tz){if(!d||!t||!tz)return null;const[y,m,dd]=d.split('-').map(Number),[h,mi]=t.split(':').map(Number);if(!y||isNaN(h))return null;const g=Date.UTC(y,m-1,dd,h,mi);const u=g-tzOff(g,tz);return g-tzOff(u,tz)}
function fromUTC(ms,tz){const s=new Date(ms+tzOff(ms,tz)).toISOString();return[s.slice(0,10),s.slice(11,16)]}
const md=d=>{const[,m,dd]=d.split('-');return `${+m}/${+dd}`};
function fmtDT(ms,tz){const[d,t]=fromUTC(ms,tz);return `${md(d)} ${t}`}
function fmtH(h){const m=Math.round(h*60);return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`}
function fmtKm(k){return Math.round(k).toLocaleString('en-US')+' km'}
function bearing(a,b){const r=Math.PI/180,f1=a[1]*r,f2=b[1]*r,dl=(b[0]-a[0])*r;const y=Math.sin(dl)*Math.cos(f2),x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl);return (Math.atan2(y,x)/r+360)%360}

function resize(){const r=fig.getBoundingClientRect(),dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const res=W<600?92:0;base=Math.min(W,H-res)*.43;proj.translate([W/2,(H-res)/2]).scale(base*zoomK);draw()}
const ro=new ResizeObserver(resize);ro.observe(fig);
const center=()=>{const r=proj.rotate();return[-r[0],-r[1]]};
function visible(p){return d3.geoDistance(p,center())<Math.PI/2-.02}
function posAt(t){const total=segs.reduce((s,g)=>s+g.d,0);let x=t*total;
  for(let i=0;i<segs.length;i++){const g=segs[i];if(x<=g.d||i===segs.length-1){const f=Math.max(0,Math.min(1,x/g.d));return{i,f,p:g.interp(f),q:g.interp(Math.min(1,f+.002)),km:t*total,rest:total-t*total}}x-=g.d}}
const atF=(g,f)=>g.timed?.25+f*Math.max(0,g.h-.5):f*g.d/SPEED+.25;
function label(t,x,y,col,font){ctx.font=font;ctx.lineWidth=4;ctx.strokeStyle=`rgba(${P.b},.85)`;ctx.lineJoin='round';ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}
function draw(){
  if(!W)return;ctx.clearRect(0,0,W,H);
  const[cx,cy]=proj.translate(),r=proj.scale();
  // halo
  const halo=ctx.createRadialGradient(cx,cy,r*.96,cx,cy,r*1.22);halo.addColorStop(0,P.h0);halo.addColorStop(.25,P.h1);halo.addColorStop(1,`rgba(${P.b},0)`);
  ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);
  // sphere
  const sph=ctx.createRadialGradient(cx-r*.35,cy-r*.4,r*.05,cx,cy,r);sph.addColorStop(0,P.s0);sph.addColorStop(.7,P.s1);sph.addColorStop(1,P.s2);
  ctx.beginPath();path({type:'Sphere'});ctx.fillStyle=sph;ctx.fill();
  ctx.beginPath();path(grat);ctx.strokeStyle=`rgba(${P.i},.045)`;ctx.lineWidth=.8;ctx.stroke();
  // land
  if(land)drawLand(r);
  // rim
  ctx.beginPath();path({type:'Sphere'});ctx.strokeStyle=`rgba(${P.i},.12)`;ctx.lineWidth=1;ctx.stroke();
  if(!segs.length)return;
  const cur=posAt(progress);
  ctx.setLineDash([2,5]);ctx.lineWidth=1.4;ctx.strokeStyle=`rgba(${P.i},.6)`;
  for(const g of segs){ctx.beginPath();path({type:'LineString',coordinates:[g.a.ll,g.b.ll]});ctx.stroke()}
  ctx.setLineDash([]);ctx.lineWidth=2;ctx.strokeStyle=P.ink;ctx.shadowColor=P.glow;ctx.shadowBlur=10;
  segs.forEach((g,i)=>{if(i<cur.i){ctx.beginPath();path({type:'LineString',coordinates:[g.a.ll,g.b.ll]});ctx.stroke()}else if(i===cur.i&&cur.f>0){ctx.beginPath();path({type:'LineString',coordinates:[g.a.ll,cur.p]});ctx.stroke()}});
  ctx.shadowBlur=0;
  for(const m of noPlane?[]:marks){if(!visible(m.ll))continue;const[x,y]=proj(m.ll),col=m.side<0?P.left:P.right;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fillStyle=col;ctx.fill();ctx.beginPath();ctx.arc(x,y,6.5,0,7);ctx.strokeStyle=col;ctx.globalAlpha=.35;ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=1;
    if(zoomK>1.6||marks.length<14)label(lmName(m),x+10,y+4,`rgba(${P.i},.8)`,'400 11px "Inter Tight","Noto Sans TC",sans-serif')}
  for(const s of stops){if(!visible(s.ll))continue;const[x,y]=proj(s.ll);ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fillStyle=P.bg;ctx.fill();ctx.lineWidth=1.6;ctx.strokeStyle=P.ink;ctx.stroke();ctx.beginPath();ctx.arc(x,y,1.8,0,7);ctx.fillStyle=P.ink;ctx.fill();
    label(s.code,x+10,y-9,P.ink,'500 14px "Inter Tight",sans-serif')}
  if(!noPlane&&visible(cur.p)){const[x,y]=proj(cur.p),[x2,y2]=proj(cur.q);const ang=Math.atan2(y2-y,x2-x);ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.shadowColor=P.glow;ctx.shadowBlur=14;ctx.fillStyle=P.ink;ctx.beginPath();
    ctx.moveTo(13,0);ctx.lineTo(4,-1.8);ctx.lineTo(-2,-11);ctx.lineTo(-4.5,-11);ctx.lineTo(-1,-1.8);ctx.lineTo(-8,-1.8);ctx.lineTo(-11,-5.5);ctx.lineTo(-12.5,-5.5);ctx.lineTo(-10.5,0);ctx.lineTo(-12.5,5.5);ctx.lineTo(-11,5.5);ctx.lineTo(-8,1.8);ctx.lineTo(-1,1.8);ctx.lineTo(-4.5,11);ctx.lineTo(-2,11);ctx.lineTo(4,1.8);ctx.closePath();ctx.fill();ctx.restore();
    const g=segs[cur.i];if(g.depU!=null)label(fromUTC(g.depU+atF(g,cur.f)*36e5,g.a.tz)[1],x+15,y-13,P.ink,'300 14px "Inter Tight",sans-serif')}
}
function drawLand(r){
  const st=mapStyle;
  if(st===0&&dots){const c=center(),cr=d3.geoRotation([-c[0],-c[1]]),sz=Math.max(1.1,Math.min(2.6,r/230));ctx.fillStyle=P.dot;
    for(const p of dots){const q=cr(p);const z=Math.cos(q[1]*Math.PI/180)*Math.cos(q[0]*Math.PI/180);if(z<=0.02)continue;const[x,y]=proj(p);ctx.globalAlpha=P.db+P.da*z;ctx.fillRect(x-sz/2,y-sz/2,sz,sz)}ctx.globalAlpha=1;
    if(zoomK>2.2){ctx.beginPath();path(land);ctx.strokeStyle=`rgba(${P.i},.14)`;ctx.lineWidth=.6;ctx.stroke()}return}
  if(st===1){ctx.beginPath();path(borders);ctx.strokeStyle=`rgba(${P.i},.16)`;ctx.lineWidth=.5;ctx.stroke();
    ctx.beginPath();path(land);ctx.strokeStyle=`rgba(${P.i},.62)`;ctx.lineWidth=.8;ctx.stroke();return}
  if(st===2){const[cx,cy]=proj.translate(),g=ctx.createRadialGradient(cx-r*.35,cy-r*.4,r*.05,cx,cy,r);g.addColorStop(0,P.l0);g.addColorStop(.75,P.l1);g.addColorStop(1,P.l2);
    ctx.beginPath();path(land);ctx.fillStyle=g;ctx.fill();ctx.beginPath();path(borders);ctx.strokeStyle=`rgba(${P.b},.75)`;ctx.lineWidth=.7;ctx.stroke();
    ctx.beginPath();path(land);ctx.strokeStyle=`rgba(${P.i},.18)`;ctx.lineWidth=.5;ctx.stroke();return}
  // city lights
  ctx.beginPath();path(land);ctx.fillStyle=P.cl;ctx.fill();ctx.strokeStyle=`rgba(${P.i},.08)`;ctx.lineWidth=.5;ctx.stroke();
  if(AP){const c=center(),cr=d3.geoRotation([-c[0],-c[1]]),k=Math.max(.8,Math.min(2.2,r/260));ctx.globalCompositeOperation=P.comp;
    for(const a of AP){const q=cr(a.ll),z=Math.cos(q[1]*Math.PI/180)*Math.cos(q[0]*Math.PI/180);if(z<=.03)continue;const[x,y]=proj(a.ll),rr=(a.big?4.2:2)*k;
      const g=ctx.createRadialGradient(x,y,0,x,y,rr);g.addColorStop(0,`rgba(${P.lt},${(a.big?.7:.32)*z})`);g.addColorStop(.35,`rgba(${P.lt2},${(a.big?.22:.1)*z})`);g.addColorStop(1,`rgba(${P.b},0)`);ctx.fillStyle=g;ctx.fillRect(x-rr,y-rr,rr*2,rr*2)}
    ctx.globalCompositeOperation='source-over'}
}
function renderStyles(){$('mapstyle').setAttribute('aria-label',T('styleLbl'));$('mapstyle').innerHTML=T('styles').map((n,i)=>`<button data-s="${i}" aria-pressed="${i===mapStyle}">${n}</button>`).join('');
  $('mapstyle').querySelectorAll('button').forEach(b=>b.onclick=()=>{mapStyle=+b.dataset.s;try{localStorage.setItem('route-globe-style',mapStyle)}catch(e){}renderStyles();draw()})}
function buildDots(){const Wm=1440,Hm=720,oc=document.createElement('canvas');oc.width=Wm;oc.height=Hm;const o=oc.getContext('2d',{willReadFrequently:true});
  const eq=d3.geoEquirectangular().scale(Wm/(2*Math.PI)).translate([Wm/2,Hm/2]);o.beginPath();d3.geoPath(eq,o)(land);o.fillStyle='#fff';o.fill();
  const px=o.getImageData(0,0,Wm,Hm).data,out=[],step=1.1;
  for(let lat=-84;lat<=84;lat+=step){const st=step/Math.max(.15,Math.cos(lat*Math.PI/180)),off=(Math.round(lat/step)%2)*st/2;
    for(let lon=-180+off;lon<180;lon+=st){const x=Math.floor((lon+180)/360*Wm),y=Math.floor((90-lat)/180*Hm);if(px[(y*Wm+x)*4+3]>128)out.push([lon,lat])}}
  dots=out;window.__dots=out.length;draw()}

d3.select(cv).call(d3.drag().on('drag',e=>{const r=proj.rotate(),k=75/proj.scale();proj.rotate([r[0]+e.dx*k,Math.max(-89,Math.min(89,r[1]-e.dy*k))]);draw()}));
fig.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoomK*Math.exp(-e.deltaY*.0015))},{passive:false});
function setZoom(k){zoomK=Math.max(.8,Math.min(12,k));proj.scale(base*zoomK);draw()}
$('zin').onclick=()=>setZoom(zoomK*1.4);$('zout').onclick=()=>setZoom(zoomK/1.4);$('fit').onclick=()=>fit();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function spinTo(r1,k1,ms){const r0=proj.rotate(),k0=zoomK;r1=r1.slice();if(Math.abs(r1[0]-r0[0])>180)r1[0]+=r1[0]>r0[0]?-360:360;const ir=d3.interpolate(r0,r1);
  const t=d3.timer(el=>{const u=reduce?1:d3.easeCubicInOut(Math.min(1,el/ms));proj.rotate(ir(u));zoomK=k0+(k1-k0)*u;proj.scale(base*zoomK);draw();if(u>=1)t.stop()})}
function fitParams(){const pts=segs.flatMap(g=>d3.range(0,1.001,.05).map(g.interp));
  const c=d3.geoCentroid({type:'MultiPoint',coordinates:pts}),a=d3.max(pts,p=>d3.geoDistance(p,c));
  return{rot:[-c[0],-c[1]],k:a>=1.45?1:Math.min(8,Math.max(1,.8/Math.sin(Math.max(a,.05))))}}
function fit(){if(!segs.length)return;const f=fitParams();spinTo(f.rot,f.k,1200)}
const centerOn=p=>spinTo([-p[0],-p[1]],zoomK,700);

// legs
function search(q){q=q.trim();if(!q)return[];const Q=q.toUpperCase(),al=ALIAS[q];
  const ex=AP.filter(a=>a.code===Q||a.code===al);
  const al2=Object.entries(ALIAS).filter(([k])=>k.includes(q)&&k!==q).map(([,v])=>byCode.get(v)).filter(Boolean);
  const rest=AP.filter(a=>!ex.includes(a)&&!al2.includes(a)&&((a.city||'').toUpperCase().includes(Q)||a.name.toUpperCase().includes(Q))).sort((a,b)=>b.big-a.big);

function findMarks(){
  marks=[];let acc=0;
  segs.forEach((g,si)=>{const n=Math.max(20,Math.ceil(g.d/15));
    LM.forEach(([,,lat,lon,rad],id)=>{const ll=[lon,lat];if(stops.some(s=>d3.geoDistance(s.ll,ll)*R<rad*.6))return;
      let best=1e9,bf=0;for(let k=0;k<=n;k++){const f=k/n,d=d3.geoDistance(g.interp(f),ll)*R;if(d<best){best=d;bf=f}}

    acc+=g.d});

    if(DL)await DL.save({filename:name,data:pdf.output('arraybuffer')});else pdf.save(name);$('pmsg').textContent='';
  }catch(e){const c=e&&e.code;$('pmsg').style.color='var(--warn)';$('pmsg').textContent=c==='declined'?'':(c==='host_unavailable'||c==='unavailable'?T('pdfNo'):T('pdfFail'))}
  finally{box&&box.remove();btn.disabled=false}};
window.__report=()=>{const b=document.createElement('div');b.id='rep';b.style.cssText='width:760px;padding:36px;background:#fff;color:#111;font:300 13px/1.55 "Inter Tight","Noto Sans TC",sans-serif';b.innerHTML=reportHTML(globeImage(688,430));document.body.appendChild(b)};

document.querySelectorAll('.lang button[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('route-globe-lang',lang)}catch(e){}applyLang()});
applyLang();

Promise.all([fetch('airports.json').then(r=>r.json()),fetch('countries-110m.json').then(r=>r.json())]).then(([a,w])=>{
  AP=a.map(([code,name,city,cc,lat,lon,big,tz])=>({code,name,city:city||name,cc,ll:[lon,lat],big,tz}));AP.forEach(x=>byCode.set(x.code,x));
  land=topojson.feature(w,w.objects.land);borders=topojson.mesh(w,w.objects.countries,(x,y)=>x!==y);buildDots();
  let saved=null;try{saved=JSON.parse(localStorage.getItem('route-globe-legs'))}catch(e){}
  if(Array.isArray(saved)&&saved.length){legs=saved.map(l=>({...blank(byCode.has(l.from)?l.from:'',byCode.has(l.to)?l.to:'',l.depD||''),depT:l.depT||'',arrD:l.arrD||'',arrT:l.arrT||'',arrAuto:!!l.arrAuto}));renderLegs();build()}
  else fromString('TPE DOH CAI');
}).catch(()=>{$('msg').textContent=T('loadFail')});
}
</script>
